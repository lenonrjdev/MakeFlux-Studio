[package]
name = "makeflux-studio"
version = "0.3.0"
description = "MakeFlux Studio"
authors = ["MakeFlux Studio"]
edition = "2021"

[lib]
name = "makeflux_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
